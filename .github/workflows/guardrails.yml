name: Guardrails

# Manual trigger only. jordann6/platform-guardrails is public now, so the
# original reason for gating this off is gone, but the jobs below are still
# `if: false` pending a deliberate cutover. See the note on `static`.
on:
  workflow_dispatch:

# Workflow-level default stays credential-free. The elevated permissions the
# plan job needs live on that job alone, so restoring a pull_request trigger
# later cannot hand an OIDC token to the static gates by accident.
permissions:
  contents: read

jobs:
  # Still gated, but no longer because the guardrails repo is private.
  # ci.yml already runs terraform fmt, validate, Checkov with no suppressions,
  # gitleaks, Trivy, and shellcheck in this repo directly, so nothing is
  # unguarded in the meantime. Turning this on means dropping the overlapping
  # jobs from ci.yml in the same change, which is a cutover to do on purpose
  # rather than a flag to flip.
  static:
    if: false
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1
    with:
      terraform_dir: terraform
      # Set once the repo has a baseline committed:
      # checkov_baseline: .checkov.baseline

  # Needs an OIDC role before it can run. Fill in aws_role_arn and remove the
  # `if: false` guard to turn on plan, destroy guard, and cost diff.
  # These permissions are what tf-plan.yml declares. GitHub resolves `uses:`
  # and checks them before it evaluates `if:`, so they are required even while
  # the job is gated off. Omitting them fails the whole run at startup, with no
  # logs and no jobs.
  plan:
    if: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-plan.yml@v1
    with:
      terraform_dir: terraform
      aws_role_arn: ""
      aws_region: us-east-2
      enable_infracost: false
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
